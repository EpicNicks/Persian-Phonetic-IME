[package]
name = "pime-settings"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Settings app and config checker for the Persian Phonetic IME (separate process, never in-host)"

[lib]
name = "pime_settings"
path = "src/lib.rs"

[[bin]]
name = "pime-settings"
path = "src/main.rs"

[dependencies]
pime-core = { path = "../pime-core" }
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
