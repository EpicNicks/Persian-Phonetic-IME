[package]
name = "pime-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Register/unregister and per-user enable helper used by the Persian Phonetic IME installer"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pime-setup"
path = "src/main.rs"

[dependencies]
pime-ids = { path = "../pime-ids" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
